# https://github.com/actions-rs/meta/blob/master/recipes/quickstart.md
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

name: Test

jobs:
  check:
    name: Check
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions/checkout@v6
      - uses: actions-rs/cargo@v1
        with:
          command: check

  # Compile-only check of the CUDA backend. Thanks to cudarc's
  # dynamic-loading, no CUDA toolkit is needed to build; kernels are
  # compiled by NVRTC at runtime. CI has no GPU, so we build but don't run.
  check-cuda:
    name: Check (cuda feature, compile only)
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions/checkout@v6
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --workspace --features fhe/cuda,fhe-math/cuda

  test:
    name: Test Suite
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions/checkout@v6
      - uses: actions-rs/cargo@v1
        with:
          command: test
